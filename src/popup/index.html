<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multifill</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 { 
      margin: 0 0 8px 0; 
      font-size: 18px; 
      font-weight: 600;
    }
    p { 
      margin: 0 0 16px 0; 
      font-size: 13px; 
      color: #555; 
      line-height: 1.4; 
    }
    button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { 
      background: #005ce6; 
    }
  </style>
</head>
<body>
  <h2>Multifill</h2>
  <p>Fill every language field of a form from one click. Translation buttons will automatically appear next to compatible input fields on the page.</p>
  <button id="optionsBtn">Open Settings</button>
  <script type="module" src="./index.ts"></script>
</body>
</html>
