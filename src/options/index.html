<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multifill Settings</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 24px; 
      max-width: 400px; 
      margin: 0 auto; 
      color: #333; 
    }
    h1 { 
      font-size: 22px; 
      margin-bottom: 24px;
    }
    .form-group { 
      margin-bottom: 20px; 
    }
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 8px; 
    }
    select, input[type="password"], input[type="text"] {
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      font-size: 14px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2);
    }
    .help-text { 
      font-size: 12px; 
      color: #666; 
      margin-top: 6px; 
      line-height: 1.4;
    }
    button { 
      background: #0066ff; 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      border-radius: 6px; 
      font-size: 14px; 
      font-weight: 600;
      cursor: pointer; 
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { 
      background: #005ce6; 
    }
    #status { 
      margin-top: 16px; 
      font-size: 14px; 
      font-weight: 600; 
      color: #059669; 
      text-align: center;
      display: none; 
    }
    .hidden { 
      display: none !important; 
    }
  </style>
</head>
<body>
  <h1>Multifill Settings</h1>
  
  <div class="form-group">
    <label for="provider">Translation Provider</label>
    <select id="provider">
      <option value="builtin">Built-in (no key required)</option>
      <option value="deepl">DeepL</option>
      <option value="google">Google Cloud Translation</option>
      <option value="llm">LLM (Bring your own)</option>
      <option value="from-to">from-to.uz</option>
    </select>
  </div>

  <div class="form-group" id="keyGroup">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your API key">
    <div class="help-text" id="keyHelp">Your key is stored securely in your browser and never leaves it.</div>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status">Settings saved successfully!</div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
